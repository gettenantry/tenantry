name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint, test & build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 20 reached end-of-life in April 2026 and pnpm 11 no longer
        # runs on it — we test on active LTS (22) and current (24).
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Vitest enforces the 90% coverage thresholds (see vitest.config.ts of
      # each package) — the suite fails hard below the gate, with or without
      # Codecov.
      - name: Unit tests (coverage gate ≥ 90%)
        run: pnpm test

      - name: Build
        run: pnpm build

      # Codecov upload for reporting/badges. Requires the CODECOV_TOKEN secret
      # (mandatory for private repos). Once the token is configured, flip
      # fail_ci_if_error to true.
      - name: Upload coverage to Codecov
        if: matrix.node == 22
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/core/coverage/lcov.info,packages/prisma/coverage/lcov.info
          fail_ci_if_error: false

  integration:
    name: Integration tests (PostgreSQL via Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Spins up a real ephemeral PostgreSQL per suite (Testcontainers uses
      # the Docker daemon available on ubuntu-latest). These tests prove
      # actual tenant isolation — no mocks.
      - name: Integration tests
        run: pnpm test:integration
