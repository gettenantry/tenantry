name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'packages/*/README.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build VitePress site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm --filter @tenantry/docs build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/.vitepress/dist

  # GitHub Pages is not available on private repositories under the org's
  # free plan. This gate keeps the workflow green while private and enables
  # deployment automatically once the repo goes public (after enabling
  # Pages with source "GitHub Actions" in the repo settings).
  visibility:
    runs-on: ubuntu-latest
    outputs:
      public: ${{ steps.check.outputs.public }}
    steps:
      - id: check
        run: echo "public=$(gh api "repos/$GITHUB_REPOSITORY" --jq 'if .private then "false" else "true" end')" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    name: Deploy to GitHub Pages
    needs: [build, visibility]
    if: needs.visibility.outputs.public == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
